name: besu-qbft

services:
  redis:
    image: redis:7-alpine
    container_name: capstone-redis
    restart: unless-stopped
    # 컨테이너 배포는 redis://redis:6379 로 접근하므로 호스트 매핑이 불필요하다.
    # 호스트에서 uvicorn을 직접 띄우는 로컬 개발용으로만 루프백에 남긴다.
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      besu-qbft:
        ipv4_address: 172.28.0.10

  validator1:
    image: ${BESU_IMAGE:-hyperledger/besu:latest}
    container_name: besu-validator1
    restart: unless-stopped
    volumes:
      - ./config:/opt/besu/config
      - ./validators/validator1/data:/opt/besu/data
    command:
      - --data-path=/opt/besu/data
      - --genesis-file=/opt/besu/config/genesis.json
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-api=ETH,NET,QBFT,WEB3
      - --host-allowlist=*
      - --rpc-http-cors-origins=all
      - --profile=ENTERPRISE
      # Prometheus 메트릭. 호스트 포트는 열지 않고 besu-qbft 네트워크 안에서만 노출한다.
      - --metrics-enabled
      - --metrics-host=0.0.0.0
      - --metrics-port=9545
    # 검증자는 호스트 포트를 열지 않는다.
    # P2P는 BOOTNODE_ENODE(172.28.0.11:30303)를 통해 브리지 네트워크 안에서만 이뤄지고,
    # 애플리케이션은 rpc-node 한 곳만 사용한다.
    networks:
      besu-qbft:
        ipv4_address: 172.28.0.11

  validator2:
    image: ${BESU_IMAGE:-hyperledger/besu:latest}
    container_name: besu-validator2
    restart: unless-stopped
    depends_on:
      - validator1
    volumes:
      - ./config:/opt/besu/config
      - ./validators/validator2/data:/opt/besu/data
    command:
      - --data-path=/opt/besu/data
      - --genesis-file=/opt/besu/config/genesis.json
      - --bootnodes=${BOOTNODE_ENODE}
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-api=ETH,NET,QBFT,WEB3
      - --host-allowlist=*
      - --rpc-http-cors-origins=all
      - --profile=ENTERPRISE
      - --metrics-enabled
      - --metrics-host=0.0.0.0
      - --metrics-port=9545
    networks:
      besu-qbft:
        ipv4_address: 172.28.0.12

  validator3:
    image: ${BESU_IMAGE:-hyperledger/besu:latest}
    container_name: besu-validator3
    restart: unless-stopped
    depends_on:
      - validator1
    volumes:
      - ./config:/opt/besu/config
      - ./validators/validator3/data:/opt/besu/data
    command:
      - --data-path=/opt/besu/data
      - --genesis-file=/opt/besu/config/genesis.json
      - --bootnodes=${BOOTNODE_ENODE}
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-api=ETH,NET,QBFT,WEB3
      - --host-allowlist=*
      - --rpc-http-cors-origins=all
      - --profile=ENTERPRISE
      - --metrics-enabled
      - --metrics-host=0.0.0.0
      - --metrics-port=9545
    networks:
      besu-qbft:
        ipv4_address: 172.28.0.13

  validator4:
    image: ${BESU_IMAGE:-hyperledger/besu:latest}
    container_name: besu-validator4
    restart: unless-stopped
    depends_on:
      - validator1
    volumes:
      - ./config:/opt/besu/config
      - ./validators/validator4/data:/opt/besu/data
    command:
      - --data-path=/opt/besu/data
      - --genesis-file=/opt/besu/config/genesis.json
      - --bootnodes=${BOOTNODE_ENODE}
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-api=ETH,NET,QBFT,WEB3
      - --host-allowlist=*
      - --rpc-http-cors-origins=all
      - --profile=ENTERPRISE
      - --metrics-enabled
      - --metrics-host=0.0.0.0
      - --metrics-port=9545
    networks:
      besu-qbft:
        ipv4_address: 172.28.0.14

  rpc-node:
    image: ${BESU_IMAGE:-hyperledger/besu:latest}
    container_name: besu-rpc-node
    restart: unless-stopped
    depends_on:
      - validator1
    volumes:
      - ./config:/opt/besu/config
      - ./rpc-node/data:/opt/besu/data
    command:
      - --data-path=/opt/besu/data
      - --genesis-file=/opt/besu/config/genesis.json
      - --bootnodes=${BOOTNODE_ENODE}
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-api=ETH,NET,QBFT,WEB3
      - --host-allowlist=*
      - --rpc-http-cors-origins=all
      - --profile=ENTERPRISE
      - --sync-mode=FULL
      - --metrics-enabled
      - --metrics-host=0.0.0.0
      - --metrics-port=9545
    # backend는 http://besu-rpc-node:8545 로 접근한다.
    # 8549는 호스트에서 배포·점검 스크립트를 돌릴 때만 쓰므로 루프백으로 제한한다.
    ports:
      - "127.0.0.1:8549:8545"
    networks:
      besu-qbft:
        ipv4_address: 172.28.0.21

networks:
  besu-qbft:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
