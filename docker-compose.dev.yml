# docker-compose.dev.yml — 로컬 개발용 인프라 스택.
#
# 목적: DB · Redis · Besu 를 컨테이너로 한 번에 띄우고, 앱(백엔드 uvicorn / 프론트 vite)은
#       호스트에서 직접 실행하는 "하이브리드" 로컬 개발 구성.
#       (프로덕션/홈서버 전체 배포는 루트 docker-compose.yml 을 사용한다.)
#
# 사용:
#   docker-compose -f docker-compose.dev.yml up -d      # 인프라 기동
#   docker-compose -f docker-compose.dev.yml down       # 인프라 정지 (데이터 볼륨은 유지)
#
# 앱은 호스트에서:
#   .venv/bin/uvicorn backend.server:app --host 0.0.0.0 --port 8000
#   (frontend/) npm run dev
name: mediledger-dev

# besu validator1~4 + rpc-node + redis 를 그대로 가져온다.
# BOOTNODE_ENODE·BESU_IMAGE 는 blockchain/besu/.env 에 있으므로 env_file 로 명시한다.
include:
  - path: blockchain/besu/docker-compose.yml
    env_file: blockchain/besu/.env

services:
  postgres:
    image: postgres:17-alpine
    container_name: mediledger-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: mediledger_db
      POSTGRES_USER: mediledger
      # 로컬 전용 비밀번호. 루트 .env 에 POSTGRES_PASSWORD 가 있으면 그 값을, 없으면 mediledger 사용.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mediledger}
    ports:
      # 호스트(uvicorn)·DBeaver 접속용. LAN 노출 방지를 위해 루프백에만 바인딩.
      - "127.0.0.1:5432:5432"
    volumes:
      - mediledger_pgdata:/var/lib/postgresql/data

volumes:
  mediledger_pgdata:
