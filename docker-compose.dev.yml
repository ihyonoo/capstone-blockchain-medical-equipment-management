# docker-compose.dev.yml — 로컬 개발용 인프라 스택

# DB·Redis·Besu만 컨테이너로 기동.
# 앱(백엔드 uvicorn·프론트 vite)은 호스트에서 직접 실행하는 하이브리드 구성.
# 홈서버 전체 배포는 루트 docker-compose.yml을 사용.

# 기동: docker-compose -f docker-compose.dev.yml up -d
# 정지: docker-compose -f docker-compose.dev.yml down
# down만으로는 데이터 볼륨이 유지됨. -v를 붙여야 삭제됨.

# 이 Compose 프로젝트의 이름.
# 컨테이너/네트워크 이름 접두사로 쓰임.
name: mediledger-dev

# blockchain/besu/docker-compose.yml을 그대로 가져옴.
# validator1~4·rpc-node가 여기서 정의됨.
# redis는 블록체인과 무관해 공유하지 않고 아래에 직접 정의함.
include:
  - path: blockchain/besu/docker-compose.yml
    # BOOTNODE_ENODE·BESU_IMAGE는 blockchain/besu/.env에 있음.
    # include 시점에 이 env_file을 명시해야 값이 주입됨.
    env_file: blockchain/besu/.env

services:
  redis:
    image: redis:7-alpine
    container_name: mediledger-redis-dev
    restart: unless-stopped
    ports:
      # 호스트(uvicorn)에서 127.0.0.1:6379로 접속.
      # 위치 캐시 전용이라 영속 볼륨 없음.
      - "127.0.0.1:6379:6379"

  postgres:
    image: postgres:17-alpine
    container_name: mediledger-postgres-dev
    # 컨테이너가 죽으면 자동 재시작.
    restart: unless-stopped
    environment:
      POSTGRES_DB: mediledger_db
      POSTGRES_USER: mediledger
      # 로컬 전용 비밀번호.
      # 루트 .env에 POSTGRES_PASSWORD가 있으면 그 값을 사용.
      # 없으면 mediledger를 기본값으로 사용.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mediledger}
    ports:
      # 호스트(uvicorn)·DBeaver 접속용.
      # 127.0.0.1에만 바인딩해 LAN에는 노출하지 않음.
      - "127.0.0.1:5432:5432"
    volumes:
      # named volume.
      # 컨테이너를 지워도 데이터는 유지됨.
      - mediledger_pgdata:/var/lib/postgresql/data

volumes:
  # docker-compose down -v로만 삭제됨.
  mediledger_pgdata:
